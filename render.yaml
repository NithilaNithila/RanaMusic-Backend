# Render Blueprint for the music backend (Express + MongoDB).
# Deploys on any push to main. Requires a managed MongoDB (Atlas or Render) URI
# set as MONGO_URI plus a JWT_SECRET in the service's environment.
services:
  - type: web
    name: music-backend
    runtime: node
    plan: free
    buildCommand: npm ci && curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/deno sh
    # yt-dlp needs a JavaScript runtime (deno) to solve YouTube's signature + n
    # challenges; without one every audio URL is withheld. Install at build so it
    # persists, then put it on PATH at start.
    startCommand: bash -lc 'export PATH="/opt/deno/bin:$PATH" && npm start'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        # Set this in the Render dashboard to your live frontend origin
        # (e.g. https://your-app.netlify.app). Without it, browsers are
        # blocked by CORS and search/play will fail in production.
        sync: false
      - key: SAAVN_API_BASE
        value: https://jiosavanwave.vercel.app/api
      - key: SPOTIFY_API_BASE
        value: https://spotify.xwolf.space/api
      - key: AMAZON_API_BASE
        value: https://amazon-music-api.onrender.com/api
      # YouTube Music gap-fill streaming (in-process yt-dlp). The yt-dlp binary
      # is downloaded during `npm ci`; override with YTDLP_BINARY to pin a build.
      - key: YT_ENABLED
        value: "true"
      # YouTube blocks anonymous playback from datacenter IPs (bot check). Paste
      # a base64-encoded cookies.txt (exported from a logged-in YouTube session)
      # here to authenticate streaming; the backend decodes it to a temp file at
      # boot. A YT_COOKIES file path (e.g. from persistent disk) takes precedence.
      - key: YT_COOKIES_B64
        sync: false
      # YouTube serves no formats to datacenter IPs (e.g. Render AWS)
      # even with valid cookies. Set a residential/ISP proxy URL
      # (http://user:pass@host:port or https://...) to stream reliably.
      # For https:// proxies, --no-check-certificate is applied automatically.
      - key: YT_PROXY
        sync: false
      # Fallback lever if web_embedded gets throttled: try "tv", "web_safari",
      # "android_vr". Leave empty to use the default (web_embedded + cookies).
      - key: YT_PLAYER_CLIENT
        sync: false
      - key: MIN_APP_VERSION
        value: "1.0.0"
      - key: LATEST_APP_VERSION
        value: "2.0.0"
      - key: APP_UPDATE_MESSAGE
        value: "A newer version of RanaMusic is available. Please update to continue."
      - key: ANDROID_STORE_URL
        value: https://play.google.com/store/apps/details?id=com.ranamusic.app
      - key: IOS_STORE_URL
        value: https://apps.apple.com/app/id0000000000
