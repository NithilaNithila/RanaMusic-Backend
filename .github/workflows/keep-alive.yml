name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sS -o /dev/null -w "backend ping -> HTTP %{http_code}\n" \
            --max-time 30 \
            https://ranamusic-backend.onrender.com/health